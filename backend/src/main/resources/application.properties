spring.application.name=pvz
spring.datasource.url=${PVZ_DB_URL:jdbc:postgresql://localhost:5432/pvz}
spring.datasource.username=${PVZ_DB_USER:pvz}
spring.datasource.password=${PVZ_DB_PASSWORD:}
spring.mvc.problemdetails.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${PVZ_SECURE_COOKIE:true}
server.servlet.session.tracking-modes=cookie
